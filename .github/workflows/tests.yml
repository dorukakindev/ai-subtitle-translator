name: Testler

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Üretilmiş kılavuzu kontrol et
        run: python belge_uret.py --kontrol
      - name: Python derleme kontrolü
        run: python -m py_compile subtitle_translator_gui.py hybrid_translate.py subtitle_formats.py
      - name: Testleri çalıştır
        run: python -m unittest discover -s tests
