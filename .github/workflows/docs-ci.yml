name: Docs CI

on:
  pull_request:
    paths: ["**.md", ".github/workflows/docs-ci.yml", ".markdownlint.json"]

permissions:
  contents: read

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm -g i markdownlint-cli2 markdown-link-check
      - run: markdownlint-cli2 "**/*.md"
      - name: Check links (relative links must resolve; external links are advisory)
        run: |
          find . -name "*.md" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 markdown-link-check -q
