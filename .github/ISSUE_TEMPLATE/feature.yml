name: Feature request
description: Propose a focused, testable improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What concrete problem occurs in normal use?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Subtitle integrity, privacy, and cost impact
      description: How would this affect timestamps, cue boundaries, privacy, or API cost?
