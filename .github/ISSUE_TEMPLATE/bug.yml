name: Bug report
description: Report a reproducible application defect.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real API keys, private subtitles, personal paths, or raw logs. Follow SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. abc1234
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workflow
      options: [Synchronous, OpenAI Batch, Assisted analysis, Interface or other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows and Python versions plus provider/model names, but no credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, and private subtitle content from all attachments.
          required: true
